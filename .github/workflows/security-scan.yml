name: Security Scan

on:
  push:
    branches: [main, staging, develop]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Jeden Montag 8 Uhr

jobs:
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks braucht die Historie
      # Nutzt automatisch die .gitleaks.toml im Repo — dieselbe Config wie lefthook lokal.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "Kein package.json — Audit übersprungen (Stack noch nicht initialisiert)."
          fi
        # PHP:    composer audit
        # Python: pip-audit

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Für andere Sprachen anpassen: python, java-kotlin, ruby, go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
