name: Claude PR Review

# Automatisches Review jedes PRs durch Claude Code — nach EStores-Standards.
# Voraussetzung: Repository-Secret ANTHROPIC_API_KEY
# (GitHub → Settings → Secrets and variables → Actions).
# Hinweis: Bei PRs aus Forks greift das Secret bewusst nicht (sicheres Verhalten).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Bot-PRs (Dependabot & Co.) überspringen — Versions-Bumps brauchen kein
    # KI-Review, und die Action verweigert Bot-Actors ohnehin (spart API-Kosten).
    # Draft-PRs ebenfalls überspringen — Review erst wenn der PR "ready" ist.
    if: github.event.pull_request.user.type != 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # persist-credentials bleibt hier bewusst an (Default) — die Claude-Action
      # nutzt git/gh im Workspace; Job hat ohnehin nur read+PR-write Rechte.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMMER: ${{ github.event.pull_request.number }}

            Führe ein Code-Review dieses Pull Requests durch. Der PR-Branch ist
            bereits ausgecheckt. Lies zuerst AGENTS.md und CLAUDE.md — dort stehen
            die verbindlichen Konventionen und das Projekt-Profil.

            Prüfe in dieser Priorität:
            1. Sicherheitslücken (Input-Validierung, Auth-Checks, Secrets im Code)
            2. Fehlerbehandlung (keine stillen Failures)
            3. Typ-Sicherheit
            4. Performance (v.a. N+1-Queries)
            5. Bei Personendaten: PII in Logs/URLs/Analytics? Consent vor Tracking?
            6. Konventionen aus CLAUDE.md (Naming, Funktionsgröße, Magic Numbers)
            7. Tests für neue Logik vorhanden?

            Ausgabe auf Deutsch. Poste EINEN zusammenfassenden Kommentar via
            `gh pr comment` mit: Gesamturteil (Bereit für Merge / Minor Issues /
            Muss überarbeitet werden), danach priorisierte Findings mit konkreten
            Fix-Vorschlägen. Für konkrete Code-Stellen nutze
            `mcp__github_inline_comment__create_inline_comment` (mit `confirmed: true`).
            Keine Findings erfinden — wenn alles gut ist, kurz bestätigen.
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
