name: CI Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

# Alle Jobs laufen erst, wenn ein package.json existiert — so ist die CI in einem
# frisch initialisierten Projekt nicht "rot ab Tag 1". Für PHP/Python-Stacks die
# Bedingungen und Befehle nach /stack-selection anpassen.

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stack vorhanden?
        id: stack
        run: echo "node=$([ -f package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.stack.outputs.node == 'yes'
        with:
          node-version: '22'
          cache: 'npm'
      - if: steps.stack.outputs.node == 'yes'
        run: npm ci
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present type-check
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present lint
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present test -- --coverage
      # Codecov nur aktivieren wenn CODECOV_TOKEN als Secret gesetzt ist:
      # - uses: codecov/codecov-action@v4
      #   with: { token: ${{ secrets.CODECOV_TOKEN }} }

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - name: Playwright konfiguriert?
        id: pw
        run: echo "ok=$([ -f playwright.config.ts ] || [ -f playwright.config.js ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.pw.outputs.ok == 'yes'
        with:
          node-version: '22'
          cache: 'npm'
      - if: steps.pw.outputs.ok == 'yes'
        run: npm ci
      - if: steps.pw.outputs.ok == 'yes'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.ok == 'yes'
        run: npm run --if-present build
      - if: steps.pw.outputs.ok == 'yes'
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure() && steps.pw.outputs.ok == 'yes'
        with:
          name: playwright-report
          path: playwright-report/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v7
      # Deploy-Step je nach Ziel einkommentieren:
      # Vercel:  run: npx vercel --token ${{ secrets.VERCEL_TOKEN }}
      # Coolify: run: curl -X POST ${{ secrets.COOLIFY_WEBHOOK }}
      # Railway: run: railway up

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Gleiche Deploy-Optionen wie Staging
