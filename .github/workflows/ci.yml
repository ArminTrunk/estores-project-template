name: CI Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

# Least-Privilege: Workflows bekommen nur Leserechte; Jobs erweitern bei Bedarf.
permissions:
  contents: read

# Überholte Läufe auf demselben PR abbrechen (spart Minuten + Wartezeit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Alle Jobs laufen erst, wenn ein package.json existiert — so ist die CI in einem
# frisch initialisierten Projekt nicht "rot ab Tag 1". Für PHP/Python-Stacks die
# Bedingungen und Befehle nach /stack-selection anpassen.
# Node-Version: EINZIGE Quelle ist .nvmrc (setup-node liest sie via node-version-file).

jobs:
  pr-title:
    name: PR-Titel (Conventional)
    # Nur bei PRs — sichert saubere Historie auch bei Squash-Merges.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore

  shell-lint:
    name: Shell-Skripte (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        # shellcheck ist auf ubuntu-latest vorinstalliert. Kein Skript vorhanden → sauber überspringen.
        run: |
          mapfile -d '' -t files < <(
            find . \( -name node_modules -o -name vendor -o -name .venv -o -name .git \) -prune -o \
                 -type f \( -name '*.sh' -o -name '*.bash' \) -print0
          )
          # -S warning: warning+error blockieren (set-e-Fallen, Trap-Scope), reine Stil-Hinweise nicht
          if [ "${#files[@]}" -eq 0 ]; then echo "Keine Shell-Skripte gefunden."; else shellcheck -S warning "${files[@]}"; fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stack vorhanden?
        id: stack
        run: echo "node=$([ -f package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.stack.outputs.node == 'yes'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.stack.outputs.node == 'yes'
        run: npm ci
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present type-check
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present lint
      - if: steps.stack.outputs.node == 'yes'
        run: npm run --if-present test -- --coverage
      # Codecov nur aktivieren wenn CODECOV_TOKEN als Secret gesetzt ist:
      # - uses: codecov/codecov-action@v4
      #   with: { token: ${{ secrets.CODECOV_TOKEN }} }

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Playwright konfiguriert?
        id: pw
        run: echo "ok=$({ [ -f playwright.config.ts ] || [ -f playwright.config.js ]; } && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pw.outputs.ok == 'yes'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.pw.outputs.ok == 'yes'
        run: npm ci
      - if: steps.pw.outputs.ok == 'yes'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.ok == 'yes'
        run: npm run --if-present build
      - if: steps.pw.outputs.ok == 'yes'
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.pw.outputs.ok == 'yes'
        with:
          name: playwright-report
          path: playwright-report/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deploy-Step je nach Ziel einkommentieren:
      # Vercel:  run: npx vercel --token ${{ secrets.VERCEL_TOKEN }}
      # Coolify: run: curl -X POST ${{ secrets.COOLIFY_WEBHOOK }}
      # Railway: run: railway up

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Gleiche Deploy-Optionen wie Staging
