# Installation: `npm i -D lefthook && npx lefthook install`
# Greift bei jedem Commit/Push — unabhängig von Claude Code Hooks.

pre-commit:
  parallel: true
  commands:
    secrets:
      run: npx gitleaks protect --staged --redact --no-banner
    lint:
      glob: "*.{js,jsx,ts,tsx,php,py}"
      run: |
        # Sprach-spezifisch anpassen — Beispiele:
        npx eslint {staged_files} --fix --quiet 2>/dev/null || true
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit --skipLibCheck 2>/dev/null || true

commit-msg:
  commands:
    conventional:
      run: |
        head -1 "{1}" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\(.+\))?!?: .+' \
          || { echo "❌ Commit-Message muss Conventional Commits folgen: type(scope): beschreibung"; exit 1; }

pre-push:
  commands:
    tests:
      run: npm test --silent || true
